version: "3.7"

networks:
  app-tier:
    driver: bridge

services:
  zookeeper-test:
    image: 'bitnamilegacy/zookeeper:latest'
    networks:
      - app-tier
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes

  kafka-test:
    image: 'confluentinc/cp-kafka:7.4.0'
    ports:
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-test:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-test:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    depends_on:
      - zookeeper-test
    networks:
      - app-tier

  laravel:
    build:
      context: .
      dockerfile: dev/Dockerfile
    entrypoint: /application/php-kafka-consumer/start.sh
    environment:
      KAFKA_BROKERS: kafka-test:29092
    volumes:
      - .:/application/php-kafka-consumer
      - ./tests:/application/laravel-test/tests
      - ./src:/application/laravel-test/src
    networks:
      - app-tier